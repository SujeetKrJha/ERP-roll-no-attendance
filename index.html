<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Processor & ID Generator</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between p-4 md:p-8">

  <div class="max-w-3xl mx-auto w-full">
    <!-- Header -->
    <header class="mb-8 text-center">
      <h1 class="text-3xl md:text-4xl font-bold text-slate-900 tracking-tight flex items-center justify-center gap-3">
        <i class="fa-solid fa-wand-magic-sparkles text-indigo-600"></i> Data Processor & ID Generator
      </h1>
      <p class="text-slate-500 mt-2 text-sm md:text-base">Sort entries or convert roll numbers according to semester rules.</p>
    </header>

    <main class="bg-white rounded-2xl shadow-xl shadow-slate-200/60 border border-slate-100 overflow-hidden">
      <!-- Mode Selection Header -->
      <div class="p-6 bg-slate-900 text-white border-b border-slate-800">
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-3">Select Mode</label>
        
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <!-- Option 1 Radio -->
          <label id="labelSort" class="flex items-center p-3 rounded-xl border border-slate-700 bg-slate-800/80 hover:bg-slate-800 cursor-pointer transition-all border-indigo-500 ring-1 ring-indigo-500">
            <input type="radio" name="mode" id="modeSort" value="sort" class="w-4 h-4 text-indigo-500 focus:ring-indigo-400 focus:ring-offset-slate-900" checked onchange="handleModeChange()">
            <div class="ml-3">
              <span class="block text-sm font-semibold text-white">1. Sort & Count</span>
              <span class="block text-xs text-slate-400">Sort names & numbers naturally</span>
            </div>
          </label>

          <!-- Option 2 Radio -->
          <label id="labelRule" class="flex items-center p-3 rounded-xl border border-slate-700 bg-slate-800/50 hover:bg-slate-800 cursor-pointer transition-all">
            <input type="radio" name="mode" id="modeRule" value="rule" class="w-4 h-4 text-indigo-500 focus:ring-indigo-400 focus:ring-offset-slate-900" onchange="handleModeChange()">
            <div class="ml-3">
              <span class="block text-sm font-semibold text-white">2. Apply Rule</span>
              <span class="block text-xs text-slate-400">Generate padded Roll Nos</span>
            </div>
          </label>
        </div>
      </div>

      <div class="p-6 md:p-8 space-y-6">
        
        <!-- Panel 1: Sort and Count Input -->
        <div id="panelSort" class="space-y-3">
          <div class="flex justify-between items-center">
            <label for="inputSortText" class="block text-sm font-semibold text-slate-700">
              <i class="fa-solid fa-arrow-down-a-z text-indigo-500 mr-1.5"></i> Paste Names and Numbers:
            </label>
            <button type="button" onclick="clearInput('inputSortText')" class="text-xs text-slate-400 hover:text-slate-600 transition">Clear</button>
          </div>
          <textarea id="inputSortText" rows="5" class="w-full p-3.5 text-sm text-slate-800 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition" placeholder="e.g. John, 25, Alice, 3, Bob, 100, 9"></textarea>
          <p class="text-xs text-slate-400">Accepts values separated by commas or line breaks.</p>
        </div>

        <!-- Panel 2: Apply Rule Input & Semester Config -->
        <div id="panelRule" class="space-y-5 hidden">
          <!-- Semester Selector -->
          <div class="p-4 bg-indigo-50/60 rounded-xl border border-indigo-100 space-y-2">
            <label class="block text-xs font-bold uppercase tracking-wider text-indigo-900">
              <i class="fa-solid fa-graduation-cap text-indigo-600 mr-1"></i> Choose Semester Rule
            </label>
            <div class="flex gap-6">
              <label class="inline-flex items-center cursor-pointer">
                <input type="radio" name="semester" value="3rd" class="w-4 h-4 text-indigo-600 focus:ring-indigo-500" checked onchange="handleSemesterChange()">
                <span class="ml-2 text-sm font-medium text-slate-800">3rd Semester <span class="text-xs text-slate-500">(0126AL25...)</span></span>
              </label>
              <label class="inline-flex items-center cursor-pointer">
                <input type="radio" name="semester" value="7th" class="w-4 h-4 text-indigo-600 focus:ring-indigo-500" onchange="handleSemesterChange()">
                <span class="ml-2 text-sm font-medium text-slate-800">7th Semester <span class="text-xs text-slate-500">(0126AL23...)</span></span>
              </label>
            </div>
          </div>

          <!-- Numbers Textbox -->
          <div class="space-y-3">
            <div class="flex justify-between items-center">
              <label for="inputRuleNumbers" class="block text-sm font-semibold text-slate-700">
                <i class="fa-solid fa-list-ol text-indigo-500 mr-1.5"></i> Paste Numbers Only:
              </label>
              <button type="button" onclick="clearInput('inputRuleNumbers')" class="text-xs text-slate-400 hover:text-slate-600 transition">Clear</button>
            </div>
            <textarea id="inputRuleNumbers" rows="5" class="w-full p-3.5 text-sm text-slate-800 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition" placeholder="e.g. 1, 5, 12, 99, 105"></textarea>
            <p class="text-xs text-slate-400">Comma or line-separated list of roll numbers.</p>
          </div>
        </div>

        <!-- Action Button -->
        <button type="button" onclick="processData()" class="w-full py-3.5 px-6 text-white font-semibold bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 rounded-xl shadow-md shadow-indigo-200 transition-all flex items-center justify-center gap-2">
          <i class="fa-solid fa-gears"></i> Process Data
        </button>

        <!-- Output Box -->
        <div id="outputSection" class="hidden pt-4 border-t border-slate-100 space-y-3">
          <div class="flex items-center justify-between">
            <span class="text-xs font-bold uppercase tracking-wider text-slate-500">Output Result</span>
            <button onclick="copyToClipboard()" class="inline-flex items-center gap-1.5 text-xs font-medium text-indigo-600 hover:text-indigo-800 bg-indigo-50 hover:bg-indigo-100 py-1.5 px-3 rounded-lg transition cursor-pointer">
              <i class="fa-regular fa-copy"></i> <span id="copyBtnText">Copy Results</span>
            </button>
          </div>

          <div class="bg-slate-900 rounded-xl p-4 text-slate-100 font-mono text-sm leading-relaxed break-words min-h-[80px]" id="outputResult">
            <!-- Processed items display here -->
          </div>

          <!-- Total Count Display (Placed Below the Results) -->
          <div class="bg-emerald-50 border border-emerald-200 text-emerald-900 rounded-xl p-4 flex items-center justify-between">
            <span class="text-sm font-semibold flex items-center gap-2">
              <i class="fa-solid fa-calculator text-emerald-600"></i> Total Count
            </span>
            <span id="outputCount" class="text-xl font-bold text-emerald-700">0</span>
          </div>
        </div>

      </div>
    </main>
  </div>

  <footer class="mt-8 text-center text-xs text-slate-400">
    Designed for fast sorting & automated roll number formatting.
  </footer>

  <script>
    // Toggle active tab styling and input panels
    function handleModeChange() {
      const isSort = document.getElementById('modeSort').checked;
      
      const panelSort = document.getElementById('panelSort');
      const panelRule = document.getElementById('panelRule');
      const labelSort = document.getElementById('labelSort');
      const labelRule = document.getElementById('labelRule');
      
      if (isSort) {
        panelSort.classList.remove('hidden');
        panelRule.classList.add('hidden');
        
        labelSort.classList.add('border-indigo-500', 'ring-1', 'ring-indigo-500', 'bg-slate-800/80');
        labelSort.classList.remove('bg-slate-800/50');
        
        labelRule.classList.remove('border-indigo-500', 'ring-1', 'ring-indigo-500', 'bg-slate-800/80');
        labelRule.classList.add('bg-slate-800/50');
      } else {
        panelSort.classList.add('hidden');
        panelRule.classList.remove('hidden');
        
        labelRule.classList.add('border-indigo-500', 'ring-1', 'ring-indigo-500', 'bg-slate-800/80');
        labelRule.classList.remove('bg-slate-800/50');
        
        labelSort.classList.remove('border-indigo-500', 'ring-1', 'ring-indigo-500', 'bg-slate-800/80');
        labelSort.classList.add('bg-slate-800/50');
      }

      // Hide output on mode switch
      document.getElementById('outputSection').classList.add('hidden');
    }

    // Auto-clear Option 2 input textbox & hide output when switching semester radio buttons
    function handleSemesterChange() {
      clearInput('inputRuleNumbers');
      document.getElementById('outputSection').classList.add('hidden');
    }

    // Helper to clear input text
    function clearInput(elementId) {
      document.getElementById(elementId).value = '';
    }

    // Helper to capitalize first letter of each word in a string
    function capitalizeWords(str) {
      // If pure number, return as is
      if (!isNaN(parseFloat(str)) && isFinite(str)) {
        return str;
      }
      return str.replace(/\b\w/g, char => char.toUpperCase());
    }

    // Main processing function
    function processData() {
      const isSort = document.getElementById('modeSort').checked;
      const outputSection = document.getElementById('outputSection');
      const outputResult = document.getElementById('outputResult');
      const outputCount = document.getElementById('outputCount');

      let rawInput = '';
      
      if (isSort) {
        rawInput = document.getElementById('inputSortText').value;
      } else {
        rawInput = document.getElementById('inputRuleNumbers').value;
      }

      // Clean and split by comma or newline
      const items = rawInput
        .split(/[\n,]+/)
        .map(item => item.trim())
        .filter(item => item !== '');

      if (items.length === 0) {
        outputSection.classList.remove('hidden');
        outputResult.innerHTML = '<span class="text-rose-400 font-sans">Please enter valid comma or line-separated inputs!</span>';
        outputCount.textContent = '0';
        return;
      }

      if (isSort) {
        // Option 1: Capitalize names, then sort naturally
        const capitalizedItems = items.map(item => capitalizeWords(item));

        const sortedItems = [...capitalizedItems].sort((a, b) => 
          a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' })
        );

        outputResult.textContent = sortedItems.join(', ');
        outputCount.textContent = sortedItems.length;

      } else {
        // Option 2: Apply Rule (Prefixing and Zero-padding)
        const selectedSem = document.querySelector('input[name="semester"]:checked').value;

        const formattedItems = items.map(item => {
          const num = parseInt(item, 10);
          
          // If value is not a pure number, return original value as fallback
          if (isNaN(num)) {
            return item;
          }

          const numStr = item;

          if (selectedSem === '3rd') {
            // 3rd Sem Rules
            if (num <= 9) {
              return `0126AL25100${numStr}`;
            } else if (num <= 99) {
              return `0126AL2510${numStr}`;
            } else {
              return `0126AL25${numStr}`;
            }
          } else {
            // 7th Sem Rules
            if (num <= 9) {
              return `0126AL23100${numStr}`;
            } else if (num <= 99) {
              return `0126AL2310${numStr}`;
            } else {
              return `0126AL23${numStr}`;
            }
          }
        });

        outputResult.textContent = formattedItems.join(', ');
        outputCount.textContent = formattedItems.length;
      }

      // Reveal result block
      outputSection.classList.remove('hidden');
    }

    // Copy logic: Option 1 copies result + total count; Option 2 copies result ONLY
    function copyToClipboard() {
      const isSort = document.getElementById('modeSort').checked;
      const resultText = document.getElementById('outputResult').innerText;
      const countText = document.getElementById('outputCount').innerText;

      if (!resultText) return;

      // In Option 1, include total count. In Option 2, copy result only.
      const fullTextToCopy = isSort 
        ? `${resultText}\nTotal Count: ${countText}`
        : resultText;

      const textarea = document.createElement('textarea');
      textarea.value = fullTextToCopy;
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.select();
      
      try {
        document.execCommand('copy');
        const btnText = document.getElementById('copyBtnText');
        btnText.textContent = 'Copied!';
        setTimeout(() => {
          btnText.textContent = 'Copy Results';
        }, 2000);
      } catch (err) {
        console.error('Failed to copy', err);
      } finally {
        document.body.removeChild(textarea);
      }
    }
  </script>
</body>
</html>
