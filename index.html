<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Reformatter by Semester</title>
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-6 rounded-2xl shadow-lg w-full max-w-md">
        <h1 class="text-2xl font-bold text-gray-800 mb-4 text-center">🔀 Semester Reformatter</h1>
        
        <!-- Semester Selection Radio Buttons -->
        <div class="mb-5">
            <label class="block text-sm font-semibold text-gray-700 mb-2">Select Semester:</label>
            <div class="flex gap-6 bg-gray-50 p-3 rounded-xl border border-gray-200">
                <label class="flex items-center space-x-2 cursor-pointer text-sm text-gray-700 font-medium">
                    <input type="radio" name="semester" value="3rd" checked class="w-4 h-4 text-blue-600 focus:ring-blue-500">
                    <span>3rd Sem</span>
                </label>
                <label class="flex items-center space-x-2 cursor-pointer text-sm text-gray-700 font-medium">
                    <input type="radio" name="semester" value="7th" class="w-4 h-4 text-blue-600 focus:ring-blue-500">
                    <span>7th Sem</span>
                </label>
            </div>
        </div>

        <label class="block text-sm font-medium text-gray-700 mb-2">Enter Comma-Separated Numbers:</label>
        <textarea id="inputNumbers" rows="4" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none mb-4" placeholder="e.g., 5, 25, 100, 150"></textarea>
        
        <button onclick="processNumbers()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold p-3 rounded-xl transition duration-200 shadow-md">
            Format Numbers
        </button>
        
        <div class="mt-6">
            <div class="flex justify-between items-center mb-2">
                <label class="block text-sm font-medium text-gray-700">Result:</label>
                <button id="copyBtn" onclick="copyToClipboard()" class="hidden text-xs bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold px-2.5 py-1 rounded transition duration-200">
                    Copy Results
                </button>
            </div>
            <div id="outputResult" class="w-full p-3 bg-gray-50 border rounded-xl min-h-[60px] break-all text-gray-800 font-mono select-all text-sm"></div>
        </div>
    </div>

    <script>
        function processNumbers() {
            const input = document.getElementById('inputNumbers').value;
            const outputDiv = document.getElementById('outputResult');
            const copyBtn = document.getElementById('copyBtn');
            
            // Get selected semester value
            const selectedSem = document.querySelector('input[name="semester"]:checked').value;

            if (!input.trim()) {
                outputDiv.innerText = "Please enter some numbers.";
                copyBtn.classList.add('hidden');
                return;
            }

            const numberArray = input.split(',')
                                    .map(num => num.trim())
                                    .filter(num => num !== "" && !isNaN(num));

            if (numberArray.length === 0) {
                outputDiv.innerText = "No valid numbers found.";
                copyBtn.classList.add('hidden');
                return;
            }

            const formattedArray = numberArray.map(numStr => {
                const num = parseFloat(numStr);
                
                if (selectedSem === '3rd') {
                    // 3rd Sem Rules
                    if (num <= 9) {
                        return `0126AL25100${numStr}`;
                    } else if (num <= 99) {
                        return `0126AL2510${numStr}`;
                    } else {
                        return `0126AL25${numStr}`;
                    }
                } else {
                    // 7th Sem Rules
                    if (num <= 9) {
                        return `0126AL23100${numStr}`;
                    } else if (num <= 99) {
                        return `0126AL2310${numStr}`;
                    } else {
                        return `0126AL23${numStr}`;
                    }
                }
            });

            outputDiv.innerText = formattedArray.join(', ');
            
            copyBtn.classList.remove('hidden');
            copyBtn.innerText = "Copy Results";
            copyBtn.className = "text-xs bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold px-2.5 py-1 rounded transition duration-200";
        }

        async function copyToClipboard() {
            const textToCopy = document.getElementById('outputResult').innerText;
            const copyBtn = document.getElementById('copyBtn');
            
            try {
                await navigator.clipboard.writeText(textToCopy);
                copyBtn.innerText = "Copied! ✓";
                copyBtn.className = "text-xs bg-green-600 text-white font-semibold px-2.5 py-1 rounded transition duration-200";
                
                setTimeout(() => {
                    copyBtn.innerText = "Copy Results";
                    copyBtn.className = "text-xs bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold px-2.5 py-1 rounded transition duration-200";
                }, 2000);
            } catch (err) {
                alert("Failed to copy text. Please select and copy manually.");
            }
        }
    </script>
</body>
</html>
